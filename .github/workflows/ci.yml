name: ci

# The flake evaluates on every system it declares, and the x86_64-linux package
# builds and passes its install check (`mcpp --version` equals release.json's
# version). The aarch64 packages are not built here: no runner of ours runs
# them under Nix, and bump.yml prefetches their assets against their hashes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Every system evaluates
        run: nix flake check -L --all-systems --no-build

      - name: The x86_64-linux package builds and runs
        run: nix flake check -L

      - name: Nix files are formatted
        run: nix fmt -- --check flake.nix package.nix

      - name: Shell scripts lint clean
        run: nix run nixpkgs#shellcheck -- scripts/*.sh
